<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LoanOrNot</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f2f5f9; margin: 0; padding: 20px; }
    .card { max-width: 560px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
    h1 { margin-top: 0; color: #1f3a5f; }
    p.sub { color: #666; margin-top: -8px; }
    label { display: block; margin-top: 12px; font-size: 14px; color: #333; }
    input { width: 100%; padding: 8px; margin-top: 4px; box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px; }
    button { width: 100%; margin-top: 20px; padding: 12px; background: #1f6feb; color: #fff; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
    button:hover { background: #1558c0; }
    #result { margin-top: 20px; padding: 14px; border-radius: 6px; text-align: center; font-size: 18px; display: none; }
    .approved { background: #d4f5dd; color: #11632b; }
    .rejected { background: #fbdada; color: #8a1c1c; }
    .error { background: #fff3cd; color: #7a5b00; }
  </style>
</head>
<body>
  <div class="card">
    <h1>LoanOrNot</h1>
    <p class="sub">Enter the applicant details to predict loan approval.</p>

    <form id="loanForm">
      <label>Applicant Income <input type="number" step="any" name="Applicant_Income" value="10000" required></label>
      <label>Coapplicant Income <input type="number" step="any" name="Coapplicant_Income" value="5000" required></label>
      <label>Age <input type="number" step="any" name="Age" value="35" required></label>
      <label>Existing Loans <input type="number" step="any" name="Existing_Loans" value="1" required></label>
      <label>Credit Score <input type="number" step="any" name="Credit_Score" value="750" required></label>
      <label>DTI Ratio <input type="number" step="any" name="DTI_Ratio" value="0.30" required></label>
      <label>Savings <input type="number" step="any" name="Savings" value="5000" required></label>
      <label>Collateral Value <input type="number" step="any" name="Collateral_Value" value="30000" required></label>
      <label>Loan Amount <input type="number" step="any" name="Loan_Amount" value="25000" required></label>
      <label>Loan Term <input type="number" step="any" name="Loan_Term" value="36" required></label>
      <button type="submit">Predict</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("loanForm");
    const resultBox = document.getElementById("result");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      // collect the form values into an object of numbers
      const data = {};
      for (const input of form.querySelectorAll("input")) {
        data[input.name] = parseFloat(input.value);
      }

      resultBox.style.display = "block";
      resultBox.className = "";
      resultBox.textContent = "Predicting...";

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        if (!response.ok) {
          resultBox.className = "error";
          resultBox.textContent = "Please check your inputs and try again.";
          return;
        }

        const result = await response.json();
        const percent = (result.approval_probability * 100).toFixed(1);
        resultBox.className = result.approved ? "approved" : "rejected";
        resultBox.textContent = result.decision + " (approval probability: " + percent + "%)";
      } catch (err) {
        resultBox.className = "error";
        resultBox.textContent = "Could not reach the server.";
      }
    });
  </script>
</body>
</html>
